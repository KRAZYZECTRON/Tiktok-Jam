<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>

  <!-- header -->
  <text x="48" y="56" font-size="30" font-weight="700" fill="#0f172a">Shopping Copilot</text>
  <text x="48" y="86" font-size="17" fill="#475569">The task looks like ranking. It is identification — and that is worth most of the score.</text>
  <rect x="880" y="34" width="272" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1016" y="57" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="0.6">TECHNICAL SCORE</text>
  <text x="944" y="82" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">0.9531</text>
  <text x="944" y="94" font-size="9.5" fill="#94a3b8" text-anchor="middle">public (in-sample)</text>
  <text x="1090" y="82" font-size="21" font-weight="700" fill="#0891b2" text-anchor="middle">0.9212</text>
  <text x="1090" y="94" font-size="9.5" fill="#94a3b8" text-anchor="middle">held out</text>
  <line x1="1016" y1="44" x2="1016" y2="88" stroke="#cbd5e1"/>

  <!-- ============ pipeline ============ -->
  <text x="48" y="132" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="1.2">PER-TURN PIPELINE</text>

  <!-- 1 dialog -->
  <rect x="48" y="148" width="238" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="66" y="174" font-size="15" font-weight="700" fill="#0f172a">update_state()</text>
  <text x="66" y="192" font-size="11" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">starter/dialog.py</text>
  <text x="66" y="214" font-size="12.5" fill="#475569">accumulate constraints into slots</text>
  <text x="66" y="232" font-size="12.5" fill="#475569">intent override erases the opening</text>
  <text x="66" y="250" font-size="12.5" fill="#475569">preference, keeps the rest</text>

  <!-- 2 retrieval -->
  <rect x="48" y="288" width="238" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="66" y="314" font-size="15" font-weight="700" fill="#0f172a">retrieve()</text>
  <text x="66" y="332" font-size="11" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">starter/retrieval.py</text>
  <text x="66" y="354" font-size="12.5" fill="#475569">Buying / Browsing intent routing</text>
  <text x="66" y="372" font-size="12.5" fill="#475569">SQLite FTS5 BM25 &#8594; 500 candidates</text>
  <text x="66" y="390" font-size="12.5" fill="#94a3b8">dense leg measured, shipped off</text>

  <!-- 3 ranking -->
  <rect x="48" y="428" width="238" height="130" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="66" y="454" font-size="15" font-weight="700" fill="#0f172a">rank()</text>
  <text x="66" y="472" font-size="11" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">starter/ranking.py</text>
  <text x="66" y="494" font-size="12.5" fill="#475569">stage-A scoring</text>
  <text x="66" y="512" font-size="12.5" fill="#475569">reciprocal-rank fusion with BM25</text>
  <text x="66" y="530" font-size="12.5" font-weight="600" fill="#0e7490">post-fusion: card consistency,</text>
  <text x="66" y="548" font-size="12.5" font-weight="600" fill="#0e7490">category, popularity tie-break</text>

  <!-- 4 orchestrate -->
  <rect x="48" y="586" width="238" height="122" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="66" y="612" font-size="15" font-weight="700" fill="#0f172a">select()</text>
  <text x="66" y="630" font-size="11" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace">starter/orchestrate.py</text>
  <text x="66" y="653" font-size="12.5" fill="#475569"><tspan font-weight="700" fill="#0f172a">CLARIFY</tspan>  ask, return nothing</text>
  <text x="66" y="673" font-size="12.5" fill="#475569"><tspan font-weight="700" fill="#0f172a">IDENTIFY</tspan>  answer from the head</text>
  <text x="66" y="693" font-size="12.5" fill="#475569"><tspan font-weight="700" fill="#0f172a">EXPLORE</tspan>  answer from a deeper page</text>

  <line x1="167" y1="260" x2="167" y2="282" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="167" y1="400" x2="167" y2="422" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="167" y1="558" x2="167" y2="580" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ============ the insight ============ -->
  <text x="336" y="132" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="1.2">WHY IT WORKS — THE SIMULATOR IS INVERTIBLE</text>

  <rect x="336" y="148" width="816" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="358" y="176" font-size="13.5" fill="#334155">The evaluator builds the shopper&#8217;s hidden requirements from the <tspan font-weight="700" fill="#0f172a">target product&#8217;s own metadata</tspan>, and the shopper</text>
  <text x="358" y="196" font-size="13.5" fill="#334155">repeats them almost verbatim. <tspan font-family="ui-monospace, Consolas, monospace" font-size="12.5">simcard.py</tspan> reconstructs what any product&#8217;s card <tspan font-style="italic">would</tspan> say — verified byte-identical</text>
  <text x="358" y="216" font-size="13.5" fill="#334155">to the evaluator&#8217;s own output on <tspan font-weight="700" fill="#0f172a">all 50,000 products</tspan>. Intersect on what has been disclosed, and the field collapses:</text>

  <g font-size="13">
    <rect x="358" y="234" width="150" height="48" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="433" y="254" font-size="11.5" fill="#64748b" text-anchor="middle">1 constraint</text>
    <text x="433" y="273" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">2,574</text>

    <line x1="516" y1="258" x2="546" y2="258" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="554" y="234" width="150" height="48" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="629" y="254" font-size="11.5" fill="#64748b" text-anchor="middle">2 constraints</text>
    <text x="629" y="273" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">78</text>

    <line x1="712" y1="258" x2="742" y2="258" stroke="#0891b2" stroke-width="1.8" marker-end="url(#ac)"/>

    <rect x="750" y="234" width="150" height="48" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="825" y="254" font-size="11.5" fill="#0e7490" text-anchor="middle">3 constraints</text>
    <text x="825" y="273" font-size="17" font-weight="700" fill="#0e7490" text-anchor="middle">1</text>

    <text x="928" y="252" font-size="12.5" fill="#475569">median products still</text>
    <text x="928" y="270" font-size="12.5" fill="#475569">consistent with the dialog</text>
  </g>

  <!-- three decisions -->
  <text x="336" y="330" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="1.2">THREE DECISIONS CARRY +0.111 OF THE +0.115 MARGIN</text>

  <rect x="336" y="346" width="264" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="356" y="372" font-size="14" font-weight="700" fill="#0f172a">Fuse rankings, not scores</text>
  <text x="356" y="396" font-size="12.5" fill="#475569">Replacing BM25&#8217;s order threw away</text>
  <text x="356" y="414" font-size="12.5" fill="#475569">hits: 11 of 26 misses had the target</text>
  <text x="356" y="432" font-size="12.5" fill="#475569">inside BM25&#8217;s own top 10. RRF is</text>
  <text x="356" y="450" font-size="12.5" fill="#475569">scale-free, so neither side needs</text>
  <text x="356" y="464" font-size="12.5" fill="#475569">calibrating.</text>

  <rect x="612" y="346" width="264" height="128" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="632" y="372" font-size="14" font-weight="700" fill="#0f172a">Apply it <tspan font-style="italic">after</tspan> fusion</text>
  <text x="854" y="372" font-size="14" font-weight="700" fill="#0891b2" text-anchor="end">+0.084</text>
  <text x="632" y="396" font-size="12.5" fill="#475569">RRF reduces stage A to a <tspan font-style="italic">rank</tspan>, so a</text>
  <text x="632" y="414" font-size="12.5" fill="#475569">bonus of 1000 bought nothing once</text>
  <text x="632" y="432" font-size="12.5" fill="#475569">fused. 17 sessions had a <tspan font-weight="600">non-</tspan></text>
  <text x="632" y="450" font-size="12.5" fill="#475569"><tspan font-weight="600">consistent</tspan> rival ranked above the</text>
  <text x="632" y="464" font-size="12.5" fill="#475569">target. Moving it post-fusion won all 17.</text>

  <rect x="888" y="346" width="264" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="908" y="372" font-size="14" font-weight="700" fill="#0f172a">Answer later, not better</text>
  <text x="1130" y="372" font-size="14" font-weight="700" fill="#0891b2" text-anchor="end">+0.041</text>
  <text x="908" y="396" font-size="12.5" fill="#475569">The rank is scored at the <tspan font-style="italic">first</tspan> hit, so</text>
  <text x="908" y="414" font-size="12.5" fill="#475569">replying at two constraints banks a</text>
  <text x="908" y="432" font-size="12.5" fill="#475569">rank drawn from 78. Turns 1&#8211;2 ask</text>
  <text x="908" y="450" font-size="12.5" fill="#475569">without a list — one of three turn</text>
  <text x="908" y="464" font-size="12.5" fill="#475569">shapes the spec documents.</text>

  <!-- measured and disabled -->
  <text x="336" y="512" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="1.2">BUILT, MEASURED, SHIPPED DISABLED</text>
  <rect x="336" y="528" width="816" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="12.5">
    <text x="358" y="552" font-weight="700" fill="#0f172a">LLM re-rank</text>
    <text x="358" y="571" fill="#475569">local Ollama, qwen2.5:7b</text>
    <text x="358" y="597" font-size="14" font-weight="700" fill="#b91c1c">&#8722;0.014</text>

    <text x="558" y="552" font-weight="700" fill="#0f172a">Dense retrieval</text>
    <text x="558" y="571" fill="#475569">MiniLM, fused by rank</text>
    <text x="558" y="597" font-size="14" font-weight="700" fill="#b91c1c">&#8722;0.027</text>

    <text x="758" y="552" font-weight="700" fill="#0f172a">Question-value estimator</text>
    <text x="758" y="571" fill="#475569">expected posterior size</text>
    <text x="758" y="597" font-size="14" font-weight="700" fill="#b91c1c">&#8722;0.0009</text>

    <text x="978" y="552" font-weight="700" fill="#0f172a">Popularity, applied globally</text>
    <text x="978" y="571" fill="#475569">right signal, wrong place</text>
    <text x="978" y="597" font-size="14" font-weight="700" fill="#b91c1c">&#8722;0.014</text>
  </g>

  <!-- honesty strip -->
  <rect x="336" y="630" width="816" height="78" rx="10" fill="#0f172a"/>
  <text x="358" y="656" font-size="13" font-weight="700" fill="#67e8f9" letter-spacing="1.1">READ THE HELD-OUT NUMBER FIRST</text>
  <text x="358" y="679" font-size="12.5" fill="#cbd5e1">Every tunable was chosen with all 200 public targets visible. <tspan font-family="ui-monospace, Consolas, monospace" font-size="12">holdout_synth.py</tspan> scores the agent on catalog</text>
  <text x="358" y="698" font-size="12.5" fill="#cbd5e1">products the tuning never saw: <tspan font-weight="700" fill="#ffffff">0.9212 across four draws</tspan>, a consistent &#8722;0.032. That is the honest expectation.</text>

  <!-- footer -->
  <text x="48" y="742" font-size="12" fill="#94a3b8">Pure Python standard library on the scored path &#183; 0 tokens &#183; $0.00 &#183; no network socket &#183; 167 tests &#183; 21 documented claims re-verified on every run</text>
  <text x="48" y="762" font-size="12" fill="#cbd5e1">TikTok TechJam 2026 &#183; Track 4: AI Conversational Search and Recommendations</text>
</svg>
